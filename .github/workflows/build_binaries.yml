name: Build Native Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_name: Morphe-Desktop-Windows-x64
          - os: ubuntu-latest
            target: linux
            artifact_name: Morphe-Desktop-Linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Fat Shadow JAR
        run: ./gradlew shadowJar assemble --no-daemon

      - name: Stage JAR for jpackage
        id: jar_path
        shell: bash
        run: |
          JAR_FILE=$(ls build/libs/*-all.jar | head -n 1)
          JAR_NAME=$(basename "$JAR_FILE")

          # Create an isolated directory specifically for jpackage input
          mkdir -p build/jpackage-input
          cp "$JAR_FILE" build/jpackage-input/

          echo "JAR_NAME=$JAR_NAME" >> $GITHUB_ENV

      # ========================================================================
      # WINDOWS: Build Executable & Package
      # ========================================================================
      - name: Package Windows Portable Executable
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          jpackage `
            --type app-image `
            --dest dist `
            --name "MorpheDesktop" `
            --input build/jpackage-input `
            --main-jar ${{ env.JAR_NAME }} `
            --main-class app.morphe.MorpheLauncherKt `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED"

          # Compress the directory itself (not the wildcard contents) to avoid zip bombs
          Compress-Archive -Path "dist/MorpheDesktop" -DestinationPath "dist/Morphe-Desktop-Windows-x64.zip"

      # ========================================================================
      # LINUX: Package AppImage via appimagetool
      # ========================================================================
      - name: Install Linux AppImage Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 wget

      - name: Package Linux AppImage
        if: matrix.target == 'linux'
        run: |
          # 1. Create native runtime image with jpackage
          jpackage \
            --type app-image \
            --dest dist \
            --name MorpheDesktop \
            --input build/jpackage-input \
            --main-jar ${{ env.JAR_NAME }} \
            --main-class app.morphe.MorpheLauncherKt \
            --java-options "-Dfile.encoding=UTF-8" \
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED"

          # 2. Structure AppDir for AppImage Creation
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps/

          cp -r dist/MorpheDesktop/* AppDir/usr/

          # Create AppRun entrypoint
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/MorpheDesktop" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Create Desktop Entry (%U allows passing file/URI arguments natively)
          cat << 'EOF' > AppDir/morphe-desktop.desktop
          [Desktop Entry]
          Name=Morphe Desktop
          Exec=MorpheDesktop %U
          Icon=morphe-desktop
          Type=Application
          Categories=Utility;
          EOF

          # Create dummy icon if icon file doesn't exist yet
          touch AppDir/usr/share/icons/hicolor/256x256/apps/morphe-desktop.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/morphe-desktop.png AppDir/morphe-desktop.png

          # 3. Download appimagetool & build AppImage
          wget https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --no-appstream AppDir dist/Morphe-Desktop-Linux-x64.AppImage

      # ========================================================================
      # ARTIFACT UPLOAD
      # ========================================================================
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.zip
            dist/*.AppImage

  release:
    name: Publish Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
